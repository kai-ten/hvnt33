# Secret scanning (CI and `npm run release:check`). Extends the default rules;
# the allowlist covers only reviewed false positives.
[extend]
useDefault = true

[[allowlists]]
description = "Vendored ReplayWeb.page build (third-party, AGPL): identifiers, not secrets"
paths = ['''^apps/server/vendor/replaywebpage/''']

[[allowlists]]
description = "Config reads the replay-link secret from the environment"
regexTarget = "line"
regexes = ['''secret: env\.HVNT33_SECRET''']

[[allowlists]]
description = "Public Tor Browser Developers signing-key fingerprint"
regexTarget = "match"
regexes = ['''EF6E286DDA85EA2A4BA7DE684E2C6E8793298290''']
