name: Feature request
description: An idea for hvnt33
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the research task and where hvnt33 gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
