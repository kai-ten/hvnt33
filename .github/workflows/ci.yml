# Every push and pull request: typecheck, unit tests and the app build on
# macOS, Windows and Linux; the server integration tests against the built-in
# database; and a secret scan. No Docker anywhere.
# The live end-to-end session is a separate, manual workflow (e2e.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: API client is up to date with the server's contract
        if: runner.os == 'Linux'
        run: |
          npm run openapi
          git diff --exit-code packages/api-client

  server:
    name: Server integration tests (${{ matrix.os }}, local and token modes)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The built-in database (checksum-verified; cached by its pins)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/server/vendor/runtime
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/server/vendor/runtime.json') }}
      - run: npm run setup
      # Each test file starts a built-in database of its own in a temporary folder.
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
        if: runner.os == 'Linux'

  website:
    name: Website release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # The npm bundled with this runner cannot resolve Playwright's current
      # registry attestation key. Keep signature enforcement with a compatible,
      # pinned npm release instead of skipping the audit.
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check -w @hvnt33/web

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (pinned release, checksum-verified)
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact
