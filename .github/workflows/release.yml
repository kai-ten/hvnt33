# Release: push a tag like v0.3.0. Builds hvnt33 for macOS (Apple Silicon and
# Intel), Windows and Linux (each one installer with the server, the built-in
# database and Tor inside), signed where the secrets below are set, and opens a
# draft GitHub release to review before publishing.
#
# macOS signing and notarization (Apple Developer ID; see docs/releasing.md):
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Windows signing (optional): WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  app:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: macos-26-intel
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      # electron-builder 26.15.3 passes the PKCS#12 password to
      # set-key-partition-list instead of its generated keychain password.
      # Import into an unlocked temporary keychain ourselves until that is fixed.
      - name: Import the Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then exit 0; fi
          certificate_path="$RUNNER_TEMP/hvnt33-signing.p12"
          keychain_path="$RUNNER_TEMP/hvnt33-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Build the installer
        shell: bash
        env:
          # Unsigned when the secrets are absent (electron-builder then skips signing).
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$CSC_LINK" ] && [ -z "$CSC_KEYCHAIN" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npm run package
      - name: Sign, notarize and staple the Mac disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_KEYCHAIN" ]; then
            echo "The Apple signing keychain was not created." >&2
            exit 1
          fi
          identity="$(security find-identity -v -p codesigning "$CSC_KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity was found." >&2
            exit 1
          fi
          found=false
          for disk_image in apps/desktop/release/*.dmg; do
            if [ ! -f "$disk_image" ]; then continue; fi
            found=true
            codesign --force --sign "$identity" --timestamp "$disk_image"
            codesign --verify --verbose=2 "$disk_image"
            xcrun notarytool submit "$disk_image" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$disk_image"
            xcrun stapler validate "$disk_image"
          done
          if [ "$found" != true ]; then
            echo "No macOS disk image was produced." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hvnt33-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
      - name: Remove the temporary Apple signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "$CSC_KEYCHAIN" ]; then security delete-keychain "$CSC_KEYCHAIN" || true; fi

  draft:
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers
          merge-multiple: true
      - name: Checksums
        working-directory: installers
        run: sha256sum *.dmg *.exe *.AppImage *.deb > SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "HVNT33 $GITHUB_REF_NAME" --notes "Signed installers for macOS, Windows and Linux. Verify downloads with SHA256SUMS. Review the CHANGELOG and test every platform before publishing."
