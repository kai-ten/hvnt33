# Release: push a tag like v0.3.0. Builds hvnt33 for macOS (Apple Silicon and
# Intel), Windows and Linux (each one installer with the server, the built-in
# database and Tor inside), signed where the secrets below are set, and opens a
# draft GitHub release to review before publishing.
#
# macOS signing and notarization (Apple Developer ID; see docs/releasing.md):
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Windows signing (optional): WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  app:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: macos-26-intel
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - name: Build the installer
        shell: bash
        env:
          # Unsigned when the secrets are absent (electron-builder then skips signing).
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hvnt33-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  draft:
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers
          merge-multiple: true
      - name: Checksums
        working-directory: installers
        run: sha256sum *.dmg *.exe *.AppImage *.deb > SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "HVNT33 $GITHUB_REF_NAME" --notes "Signed installers for macOS, Windows and Linux. Verify downloads with SHA256SUMS. Review the CHANGELOG and test every platform before publishing."
